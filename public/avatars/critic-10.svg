<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="厳しい批評家">
  <circle cx="100" cy="100" r="100" fill="#e5e7eb"/>
  <!-- 肩(上半身)。首のすぐ下から画面の外まではみ出す大きな1つの楕円にすることで、
       表示側の丸いクリップ(rounded-full)と合わせて自然な肩のなで肩カーブになる
       (左右2つの楕円+矩形にすると継ぎ目に背景色の隙間ができたため、1つにまとめた)。 -->
  <ellipse cx="100" cy="178" rx="92" ry="48" fill="#374151"/>
  <!-- 首 -->
  <rect x="84" y="110" width="32" height="45" fill="#f2c9a0"/>
  <!-- 首と肩の境目のV字の襟(装飾) -->
  <path d="M85,148 L100,162 L115,148" fill="none" stroke="#141e2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 耳(頭部の下敷きになる分を先に描く) -->
  <circle cx="59" cy="90" r="8" fill="#f2c9a0"/>
  <circle cx="141" cy="90" r="8" fill="#f2c9a0"/>
  <!-- 頭部 -->
  <circle cx="100" cy="88" r="44" fill="#f2c9a0"/>
  <path d="M56,68 A44,44 0 0 1 144,68" fill="none" stroke="#a9a9a9" stroke-width="4" opacity="0.6"/>
  <circle cx="85" cy="83" r="4" fill="#292524"/>
  <circle cx="115" cy="83" r="4" fill="#292524"/>
  <line x1="76" y1="66" x2="90" y2="71" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
      <line x1="110" y1="71" x2="124" y2="66" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
  <path d="M98,90 Q95,98 100,100" fill="none" stroke="rgba(41,37,36,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M83,112 Q100,98 117,112" fill="none" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
  
</svg>
