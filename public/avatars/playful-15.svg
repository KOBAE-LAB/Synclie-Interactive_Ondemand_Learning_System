<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ユーモラスな仕掛け人">
  <circle cx="100" cy="100" r="100" fill="#fdba74"/>
  <!-- 肩(上半身)。首のすぐ下から画面の外まではみ出す大きな1つの楕円にすることで、
       表示側の丸いクリップ(rounded-full)と合わせて自然な肩のなで肩カーブになる
       (左右2つの楕円+矩形にすると継ぎ目に背景色の隙間ができたため、1つにまとめた)。 -->
  <ellipse cx="100" cy="178" rx="92" ry="48" fill="#f59e0b"/>
  <!-- 首 -->
  <rect x="84" y="110" width="32" height="45" fill="#e8b48a"/>
  <!-- 首と肩の境目のV字の襟(装飾) -->
  <path d="M85,148 L100,162 L115,148" fill="none" stroke="#d27b00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 耳(頭部の下敷きになる分を先に描く) -->
  <circle cx="59" cy="90" r="8" fill="#e8b48a"/>
  <circle cx="141" cy="90" r="8" fill="#e8b48a"/>
  <!-- 頭部 -->
  <circle cx="100" cy="88" r="44" fill="#e8b48a"/>
  <path d="M54,64 L65,31 L75,61 L87,24 L100,59 L114,24 L125,61 L136,31 L146,64 Z" fill="#4a2c1a"/>
  <circle cx="85" cy="83" r="4" fill="#292524"/>
  <circle cx="115" cy="83" r="4" fill="#292524"/>
  <line x1="76" y1="71" x2="90" y2="66" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
      <line x1="110" y1="66" x2="124" y2="71" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
  <path d="M98,90 Q95,98 100,100" fill="none" stroke="rgba(41,37,36,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M85,105 Q100,110 115,100" fill="none" stroke="#292524" stroke-width="4" stroke-linecap="round"/>
  
</svg>
