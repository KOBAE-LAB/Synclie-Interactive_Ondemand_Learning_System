<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="背景">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="60%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#base)"/>
  <g filter="url(#blur)">
    <circle cx="80" cy="100" r="95" fill="#f5c518" opacity="0.14"/>
    <circle cx="330" cy="70" r="75" fill="#c07772" opacity="0.12"/>
    <circle cx="300" cy="330" r="110" fill="#a81c1c" opacity="0.1"/>
  </g>
</svg>
